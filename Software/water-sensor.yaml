esphome:
  name: water-sensor-tandon
  friendly_name: Water Sensor Tandon

esp8266:
  board: nodemcuv2

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  # encryption:
  #   key: "00000"

ota:
  platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  fast_connect: true
  power_save_mode: none
  reboot_timeout: 5min

  on_connect:
    - light.turn_on: wifi_led

  on_disconnect:
    - light.turn_off: wifi_led

deep_sleep:
  id: deep_sleep_control

time:
  - platform: sntp
    id: waktu_sistem
    timezone: Asia/Makassar

output:
  - platform: gpio
    pin:
      number: GPIO2
      inverted: true
    id: led_wifi_output

light:
  - platform: binary
    name: "LED WiFi"
    output: led_wifi_output
    id: wifi_led


# =========================
# GLOBAL VARIABLE
# =========================
globals:

  - id: baterai_lemah_v
    type: float
    restore_value: no
    initial_value: '3.00'

i2c:
  sda: GPIO4
  scl: GPIO5
  scan: true

binary_sensor:
  - platform: homeassistant
    name: "Status Mesin Air"
    id: mesin_air_ha
    entity_id: switch.mesin_air_water_pump_relay_2

# === SENSOR ===
sensor:
  # ---- INA219 Battery Monitoring ----
  - platform: ina219
    address: 0x40
    shunt_resistance: 0.1 ohm
    update_interval: 10s

    current:
      name: "Arus Baterai Kost"
      id: arus_baterai_kost
      unit_of_measurement: "A"
      accuracy_decimals: 3
      filters:
        - median:
            window_size: 5
            send_every: 3
        - exponential_moving_average:
            alpha: 0.2

    bus_voltage:
      name: "Tegangan Baterai Kost"
      id: tegangan_baterai_kost
      unit_of_measurement: "V"
      accuracy_decimals: 2
      filters:
        - median:
            window_size: 5
            send_every: 3
        - exponential_moving_average:
            alpha: 0.2

    power:
      name: "Daya Kost"
      unit_of_measurement: "W"
      accuracy_decimals: 2
      filters:
        - median:
            window_size: 5
            send_every: 3
        - exponential_moving_average:
            alpha: 0.2

# ---- Ultrasonic Water Level (D5=GPIO14 trigger, D6=GPIO12 echo) ----
  - platform: ultrasonic
    trigger_pin: GPIO14
    echo_pin: GPIO12
    name: "Water Level Kost"
    id: persen_air
    update_interval: 10s
    unit_of_measurement: "%"
    accuracy_decimals: 1
    filters:
      - filter_out: nan
      - median:
          window_size: 5
          send_every: 3
          send_first_at: 3
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1
      - lambda: |-
          const float low_level = 1.30;   // permukaan air saat kosong
          const float high_level = 0.30;  // permukaan air saat penuh

          if (x > low_level) {
            return 0.0;
          } else if (x < high_level) {
            return 100.0;
          } else {
            return (1.0 - (x - high_level) / (low_level - high_level)) * 100.0;
          }


  # ---- Persentase Baterai dari bus_voltage INA219 ----
  - platform: template
    name: "Persentase Baterai Kost"
    id: persentase_baterai_kost
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      if (!id(tegangan_baterai_kost).has_state() || isnan(id(tegangan_baterai_kost).state)) return {};
      float voltage = id(tegangan_baterai_kost).state;
      float min_v = id(baterai_lemah_v);
      float max_v = 4.2;   // baterai penuh
      float pct = ((voltage - min_v) / (max_v - min_v)) * 100.0;
      if (pct > 100) pct = 100;
      if (pct < 0) pct = 0;
      return pct;
    filters:
      - median:
          window_size: 5
          send_every: 3
          send_first_at: 3
      - exponential_moving_average:
          alpha: 0.2
          send_every: 1

# =========================
# LOGIKA DEEP SLEEP ADAPTIF
# Prioritas pengecekan (dari atas ke bawah):
#   1. Mesin air MENYALA         -> TIDAK PERNAH sleep, apapun kondisi lain
#   2. Baterai lemah             -> sleep panjang (2 jam), selamatkan baterai
#   3. Malam + air >=80%         -> sleep 1 jam
#   4. Malam + air <80%          -> TIDAK sleep (HA masih isi air, tunggu sampai penuh)
#   5. Siang                     -> TIDAK PERNAH sleep, apapun level airnya
#
# "Siang" = 06:00-19:59, "Malam" = 20:00-05:59.
# ESP tetap aktif 10 menit tiap siklus (jendela OTA) sebelum evaluasi --
# ini sekaligus cukup untuk NTP sync (biasanya cuma 2-5 detik), jadi
# tidak perlu pengecekan sync terpisah lagi.
# =========================
interval:
  - interval: 10min
    then:
      # ESP tetap AWAKE selama 10 menit penuh setelah bangun/boot --
      # cukup untuk sempat push OTA kalau perlu, dan supaya semua sensor
      # (terutama yang pakai filter median/EMA) sempat stabil sebelum
      # dipakai untuk pengambilan keputusan di bawah.
      - logger.log: "ESP aktif 5 menit, silakan upload OTA sekarang kalau perlu."
      - delay: 5min

      - lambda: |-
          if (id(persen_air).has_state()) {
            ESP_LOGI("main", "Persentase air: %.1f%%", id(persen_air).state);
          }
          if (id(tegangan_baterai_kost).has_state()) {
            ESP_LOGI("main", "Tegangan baterai: %.2fV", id(tegangan_baterai_kost).state);
          }
          if (id(mesin_air_ha).has_state()) {
            ESP_LOGI("main", "Status mesin air: %s", id(mesin_air_ha).state ? "ON" : "OFF");
          } else {
            ESP_LOGW("main", "Status mesin air belum tersedia / belum terbaca");
          }
          auto t = id(waktu_sistem).now();
          if (t.is_valid()) {
            ESP_LOGI("main", "Jam sekarang: %02d:%02d", t.hour, t.minute);
          } else {
            ESP_LOGW("main", "Waktu belum sinkron (NTP belum berhasil)");
          }

      # ---- 1. Mesin air menyala -> prioritas tertinggi, jangan sleep ----
      - if:
          condition:
            lambda: |-
              return id(mesin_air_ha).has_state() && id(mesin_air_ha).state;

          then:
            - logger.log: "Mesin air menyala, ESP TIDAK sleep."

          else:
            # ---- 2. Baterai lemah -> sleep panjang, selamatkan baterai ----
            - if:
                condition:
                  lambda: |-
                    return id(tegangan_baterai_kost).has_state()
                        && id(tegangan_baterai_kost).state < id(baterai_lemah_v);

                then:
                  - logger.log: "Baterai lemah, sleep 2 jam untuk menghemat baterai."
                  - deep_sleep.enter:
                      id: deep_sleep_control
                      sleep_duration: 2h

                else:
                  # ---- 3. Hanya sleep di MALAM hari, dan hanya kalau air sudah >=70% ----
                  # Siang hari: TIDAK PERNAH sleep, apapun level airnya.
                  - if:
                      # true = malam (20:00-05:59), false = siang (06:00-19:59).
                      # Kalau waktu belum sinkron, anggap SIANG (safe default)
                      # supaya device tetap cek lebih sering, bukan sleep buta.
                      condition:
                        lambda: |-
                          auto t = id(waktu_sistem).now();
                          if (!t.is_valid()) {
                            return false;  // anggap siang
                          }
                          return t.hour >= 20 || t.hour < 6;

                      then:
                        # ---- MALAM ----
                        - if:
                            condition:
                              lambda: |-
                                return id(persen_air).has_state()
                                    && id(persen_air).state >= 70.0;

                            then:
                              - logger.log: "Malam, air >=70%, sleep 1 jam."
                              - deep_sleep.enter:
                                  id: deep_sleep_control
                                  sleep_duration: 1h

                            else:
                              - logger.log: "Malam, air <70% (menunggu HA isi air), ESP TIDAK sleep."

                      else:
                        # ---- SIANG ----
                        - logger.log: "Siang hari, ESP TIDAK sleep."

# === SWITCH ===
switch:
  - platform: restart
    name: "Restart Sensor Water Level"

